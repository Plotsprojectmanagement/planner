<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Planner</title>
<style>
:root{color-scheme:light dark}
body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;margin:0;min-height:100vh;display:grid;place-items:center;background:#f9f9f7;color:#0b0b0b}
@media(prefers-color-scheme:dark){body{background:#0d0d0d;color:#fff}}
.card{background:#fcfcfb;border:1px solid rgba(11,11,11,.1);border-radius:16px;padding:34px 38px;width:min(92vw,360px);box-shadow:0 4px 24px rgba(11,11,11,.08);text-align:center}
@media(prefers-color-scheme:dark){.card{background:#1a1a19;border-color:rgba(255,255,255,.1)}}
h1{font-size:19px;margin:0 0 4px}
p.sub{color:#898781;font-size:13px;margin:0 0 18px}
input[type=password]{width:100%;box-sizing:border-box;font:inherit;padding:10px 12px;border:1px solid #c3c2b7;border-radius:9px;background:transparent;color:inherit}
input[type=password]:focus{outline:2px solid #2a78d6;border-color:transparent}
button{width:100%;margin-top:12px;font:inherit;font-weight:600;padding:10px;border:none;border-radius:9px;background:#2a78d6;color:#fff;cursor:pointer}
button:disabled{opacity:.6}
label{display:flex;gap:7px;align-items:center;justify-content:center;font-size:12.5px;color:#898781;margin-top:12px;cursor:pointer}
#err{color:#d03b3b;font-size:13px;min-height:18px;margin:10px 0 0}
</style>
</head>
<body>
<form class="card" id="f">
  <h1>&#128274; Planner</h1>
  <p class="sub">Voer je wachtwoord in om het dashboard te openen.</p>
  <input type="password" id="pw" placeholder="Wachtwoord" autocomplete="current-password" autofocus>
  <button id="btn">Ontgrendelen</button>
  <label><input type="checkbox" id="rem"> Onthoud in deze browser</label>
  <p id="err"></p>
</form>

const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
async function keyFromPassword(pw){
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(DATA.salt),iterations:DATA.iter,hash:'SHA-256'},km,{name:'AES-GCM',length:256},true,['decrypt']);
}
async function unlock(key){
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(DATA.iv)},key,b64(DATA.ct));
  const html=new TextDecoder().decode(pt);
  document.open();document.write(html);document.close();
}
document.getElementById('f').addEventListener('submit',async ev=>{
  ev.preventDefault();
  const btn=document.getElementById('btn'),err=document.getElementById('err');
  btn.disabled=true;err.textContent='';
  try{
    const key=await keyFromPassword(document.getElementById('pw').value);
    if(document.getElementById('rem').checked){
      const raw=await crypto.subtle.exportKey('raw',key);
      store.set('planner_unlock',btoa(String.fromCharCode(...new Uint8Array(raw))));
    }
    await unlock(key);
  }catch(e){err.textContent='Onjuist wachtwoord.';btn.disabled=false;store.del('planner_unlock');}
});
(async()=>{
  const saved=store.get('planner_unlock');
  if(!saved)return;
  try{
    const key=await crypto.subtle.importKey('raw',b64(saved),{name:'AES-GCM'},false,['decrypt']);
    await unlock(key);
  }catch(e){store.del('planner_unlock');}
})();
})();
